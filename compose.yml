services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: solstice-coffee:production
    expose:
      - "80"
    environment:
      APP_NAME: "Solstice Coffee"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${base64:zFqdg8H0uJCnft2kK3U2MEn77x3Y2+5rq8mlHmzx7TQ=}"
      APP_URL: "${https://solstice-coffee.wasmer.app}"
      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      DB_CONNECTION: pgsql
      DB_HOST: "${aws-0-ap-northeast-1.pooler.supabase.com}"
      DB_PORT: "${5432}"
      DB_DATABASE: "${postgres}"
      DB_USERNAME: "${postgres.fivxxzzsfkvxuqwheynz}"
      DB_PASSWORD: "${SolsticeCoffe710}"

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
    volumes:
      - solstice_storage:/var/www/html/storage/app/public
    restart: unless-stopped

volumes:
  solstice_storage:
